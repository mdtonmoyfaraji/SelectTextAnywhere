name: Build Windows EXE

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build TextGrabber.exe (no console window)
        run: pyinstaller --onefile --noconsole --name TextGrabber --collect-all winrt main.py

      - name: Build TextGrabber-debug.exe (with console, shows errors)
        run: pyinstaller --onefile --console --name TextGrabber-debug --collect-all winrt main.py

      - name: Upload exe files
        uses: actions/upload-artifact@v4
        with:
          name: TextGrabber-windows
          path: dist/*.exe

      - name: Attach to GitHub Release (only on tags like v1.0)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
